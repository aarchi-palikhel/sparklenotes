{% extends 'notes/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="note-card p-8 rounded-2xl">
        <h2 class="text-3xl font-bold sparkle-text mb-8">My Profile 👤</h2>

        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">First Name</label>
                    {{ form.first_name }}
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Last Name</label>
                    {{ form.last_name }}
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                {{ form.email }}
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Bio</label>
                {{ form.bio }}
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Profile Picture</label>
                {{ form.avatar }}
            </div>

            <div class="flex gap-4">
                <button type="submit" class="btn-pink text-white px-6 py-3 rounded-lg font-semibold">
                    Save Changes ✨
                </button>
                <a href="{% url 'home' %}" class="bg-gray-400 hover:bg-gray-500 text-white px-6 py-3 rounded-lg font-semibold">
                    Back
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
