{% extends 'notes/base.html' %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-8">
    <div class="w-full max-w-sm">
        <!-- Card -->
        <div class="note-card p-8 rounded-3xl shadow-2xl backdrop-blur-sm text-center">
            <!-- Icon -->
            <div class="inline-block bg-red-100 dark:bg-red-900 p-4 rounded-full mb-6 shadow-lg">
                <span class="text-4xl" title="Warning icon">⚠️</span>
            </div>

            <h1 class="text-3xl font-bold text-red-500 dark:text-red-400 mb-3">Link Expired</h1>

            <p class="text-gray-600 dark:text-gray-300 text-sm leading-relaxed mb-6">
                This password reset link is invalid or has expired.
                Reset links are only valid for <strong>24 hours</strong>.
            </p>

            <a href="{% url 'accounts:password_reset' %}"
               class="btn-pink text-white px-6 py-3 rounded-xl font-bold inline-block text-sm hover:shadow-xl transition duration-300 transform hover:-translate-y-1 mb-4">
                Request a New Link 🔑
            </a>

            <p class="text-gray-500 dark:text-gray-400 text-xs mt-2">
                <a href="{% url 'accounts:login' %}" class="text-pink-500 dark:text-pink-400 font-semibold hover:text-pink-700 transition">
                    ← Back to Login
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
