{% extends 'notes/base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <div class="note-card p-8 rounded-2xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold sparkle-text mb-2">Login 💕</h2>
            <p class="text-gray-600">Welcome back to SparkleNotes!</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                {{ form.username }}
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn-pink text-white px-6 py-3 rounded-lg font-semibold w-full">
                Login ✨
            </button>
        </form>

        <p class="text-center mt-6 text-gray-600">
            Don't have an account? 
            <a href="{% url 'accounts:register' %}" class="text-pink-500 font-semibold hover:text-pink-700">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
