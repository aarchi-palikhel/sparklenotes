{% extends 'notes/base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="text-center mb-8">
        <div class="w-16 h-16 bg-linear-to-r from-green-400 to-blue-500 rounded-full mx-auto mb-4 flex items-center justify-center">
            <span class="text-white text-2xl">✅</span>
        </div>
        <h2 class="text-4xl font-bold sparkle-text">{{ title }} 🌟</h2>
    </div>
    
    <div class="todo-card p-8 rounded-2xl">
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-6">
                <label class="text-purple-700 font-bold mb-3 text-lg flex items-center">
                    <span class="mr-2">📝</span>Task Title
                </label>
                <input type="text" name="title" value="{{ form.title.value|default:'' }}" 
                       class="w-full p-4 border-2 border-purple-200 rounded-xl focus:border-purple-400 focus:ring-2 focus:ring-purple-200 outline-none transition duration-300"
                       placeholder="What do you want to accomplish? ✨" required>
            </div>
            
            <div class="mb-6">
                <label class="text-purple-700 font-bold mb-3 text-lg flex items-center">
                    <span class="mr-2">📄</span>Description (Optional)
                </label>
                <textarea name="description" rows="4" 
                          class="w-full p-4 border-2 border-purple-200 rounded-xl focus:border-purple-400 focus:ring-2 focus:ring-purple-200 outline-none transition duration-300"
                          placeholder="Add some details about your task... 🌈">{{ form.description.value|default:'' }}</textarea>
            </div>
            
            <div class="mb-6">
                <label class="text-purple-700 font-bold mb-3 text-lg flex items-center">
                    <span class="mr-2">📅</span>Due Date &amp; Time (Optional)
                </label>
                <div class="flex gap-2 items-start">
                    <div class="flex-1">
                        <input type="datetime-local" name="due_date" id="due_date"
                               value="{% if form.due_date.value %}{{ form.due_date.value|date:'Y-m-d\TH:i' }}{% endif %}"
                               style="width:100%;padding:14px 16px;border:2px solid #d8b4fe;border-radius:12px;font-size:1rem;font-family:inherit;background:#faf5ff;color:#6b21a8;cursor:pointer;outline:none;appearance:auto;-webkit-appearance:auto;box-sizing:border-box;">
                    </div>
                    <button type="button" onclick="suggestDueDate()"
                            class="bg-linear-to-r from-purple-400 to-pink-400 text-white px-4 py-3 rounded-xl text-sm font-semibold hover:shadow-lg transition whitespace-nowrap"
                            title="AI suggest due date">
                        🤖 Suggest
                    </button>
                </div>
                <p id="dueDateLoading" class="text-xs text-purple-500 mt-1 hidden">✨ Thinking of a deadline...</p>
                <p class="text-xs text-gray-500 mt-2">📌 Leave empty if there's no deadline</p>
            </div>
            
            <div class="flex space-x-4 justify-center">
                <button type="submit" class="btn-pink text-white px-8 py-3 rounded-full font-semibold text-lg shadow-lg flex items-center">
                    <span class="mr-2">💾</span>Save Todo
                </button>
                <a href="{% url 'todo_list' %}" class="bg-linear-to-r from-gray-400 to-gray-500 text-white px-8 py-3 rounded-full font-semibold text-lg shadow-lg hover:shadow-xl transition duration-300 flex items-center">
                    <span class="mr-2">❌</span>Cancel
                </a>
            </div>
        </form>
    </div>
</div>

<script>
const CSRF_TODO = document.querySelector('[name=csrfmiddlewaretoken]').value;

function suggestDueDate() {
    const title = document.querySelector('[name=title]').value.trim();
    const desc  = document.querySelector('[name=description]').value.trim();
    const text  = (title + ' ' + desc).trim();
    if (!text) { alert('Enter a task title or description first! ✨'); return; }

    const loading = document.getElementById('dueDateLoading');
    loading.classList.remove('hidden');

    fetch('{% url "suggest_due_date" %}', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': CSRF_TODO },
        body: 'description=' + encodeURIComponent(text)
    })
    .then(r => r.json())
    .then(data => {
        loading.classList.add('hidden');
        if (data.due_date) {
            document.getElementById('due_date').value = data.due_date;
        }
    })
    .catch(() => loading.classList.add('hidden'));
}
</script>
{% endblock %}
